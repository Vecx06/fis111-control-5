<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FIS111 Control 5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a single "video player" — 1280x720 stage scaled to fit, captions + chapters below. Single deliberate dark look. */
:root{
  --bg:#060608; --bg2:#0d0d12; --bg3:#15151c; --grid:rgba(190,185,255,.05);
  --line:#7d7b88; --line2:#44434d; --ink:#eeedf3; --dim:#9a98a6; --faint:#5e5c68;
  --acc:#b48cff; --acc-soft:rgba(180,140,255,.12);
  --peso:#57d4c2; --normal:#eeedf3; --roce:#ff6b7d; --ten:#b48cff; --ela:#f4b55c; --acel:#ff8fd0; --vel:#8fc7ff;
  --K:#b48cff; --Ug:#57d4c2; --Ue:#f4b55c; --mom:#f4b55c; --imp:#ff8fd0; --A:#8fc7ff; --B:#ff6b7d; --C:#57d4c2;
  --f-disp:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Figtree',ui-sans-serif,system-ui,sans-serif;
  --f-math:'STIX Two Text','Cambria Math',Cambria,Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.top h1{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:clamp(22px,3.2vw,32px);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.top p{margin:0;color:var(--dim);font-size:14px;font-family:var(--f-mono)}

#player{background:#000;border-radius:14px;overflow:hidden;border:1px solid #1c1b23;position:relative}
#player:fullscreen{border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;background:#000}
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg);margin:0 auto;max-width:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,.78) 100%),
    linear-gradient(var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/80px 80px,
    var(--bg);
  animation:drift 90s linear infinite}
@keyframes drift{to{background-position:0 0,0 80px,80px 0,0 0}}
.mark{position:absolute;right:26px;bottom:20px;font-family:var(--f-mono);font-size:15px;letter-spacing:.12em;color:var(--faint);z-index:5}

#big{position:absolute;inset:0;margin:auto;width:116px;height:116px;border-radius:50%;border:2px solid var(--acc);background:rgba(10,8,16,.75);color:var(--ink);cursor:pointer;display:grid;place-items:center;z-index:6;box-shadow:0 0 60px rgba(180,140,255,.35);transition:transform .2s}
#big:hover{transform:scale(1.06)}
#big svg{width:44px;height:44px;margin-left:6px}
#resume{position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:7;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#resume button{font:600 14px var(--f-body);color:var(--ink);background:rgba(20,18,28,.92);border:1px solid var(--acc);border-radius:999px;padding:8px 14px;cursor:pointer}
#resume button+button{border-color:#2d2c36;color:var(--dim)}

#ctl{display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px;background:#000}
#bar{position:relative;height:20px;cursor:pointer;touch-action:none;outline:none}
#bar .tr{position:absolute;left:0;right:0;top:8px;height:4px;background:#2a2932;border-radius:2px}
#bar .fill{position:absolute;left:0;top:8px;height:4px;background:var(--acc);border-radius:2px;width:0}
#bar .knob{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;translate:-50% 0;left:0;box-shadow:0 0 0 3px rgba(180,140,255,.35)}
#bar .tick{position:absolute;top:8px;width:3px;height:4px;background:#000;translate:-50% 0}
#bar:focus-visible .tr{outline:2px solid var(--acc);outline-offset:4px}
#tip{position:absolute;bottom:22px;translate:-50% 0;background:#16151d;border:1px solid #2d2c36;color:var(--ink);font:500 12px var(--f-body);padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
button.ic{background:none;border:0;color:var(--ink);width:40px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
button.ic svg{width:22px;height:22px}
button.ic:hover{background:#1a1a21}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#time{font-family:var(--f-mono);font-size:13px;color:var(--dim);margin:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#chName{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 120px}
button.tx{font:600 13px var(--f-mono);color:var(--ink);background:#15151b;border:1px solid #2a2930;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button.tx[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
button.tx:disabled{opacity:.45;cursor:not-allowed}
#cap{padding:16px 20px 18px;background:var(--bg2);border-top:1px solid #1c1b23;min-height:118px}
#cap .ct{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#cap .cx{font-size:clamp(16px,2.1vw,20px);line-height:1.55;color:var(--ink);max-width:78ch;text-wrap:pretty}
#player:fullscreen #cap{min-height:0}

section h3{font-family:var(--f-disp);font-stretch:110%;font-weight:800;font-size:20px;margin:6px 0 10px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.chs button{text-align:left;background:var(--bg2);border:1px solid #1d1c25;border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-width:0}
.chs button:hover{border-color:#34333e}
.chs button.on{border-color:var(--acc);background:#120f1b}
.chs .n{font-family:var(--f-mono);color:var(--faint);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.chs .t{font-weight:600;font-size:15px;display:block}
.chs .s{display:block;color:var(--dim);font-size:13px;margin-top:2px}
.keys{color:var(--dim);font-size:13px;margin:0}
kbd,.kb{font-family:var(--f-mono);font-size:.85em;border:1px solid #34333e;border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#14141a;color:var(--ink)}

.vc{position:relative;display:inline-block}
.vc::before{content:'';position:absolute;left:12%;right:2%;top:-.06em;height:.08em;background:currentColor;border-radius:1px}
.vc::after{content:'';position:absolute;right:-.06em;top:-.2em;border-left:.24em solid currentColor;border-top:.14em solid transparent;border-bottom:.14em solid transparent}
.tagx{position:absolute;font-family:var(--f-mono);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.art .ttl{font-family:var(--f-mono);font-size:18px;letter-spacing:.14em;fill:var(--dim)}
[hidden]{display:none!important}
/* ===== stage content ===== */
.scene{position:absolute;inset:0;transition:opacity .75s ease,transform 1s cubic-bezier(.2,.8,.2,1),filter .75s ease}
.scene.pre{opacity:0;transform:scale(1.04) translateY(10px);filter:blur(10px)}
.scene.out{opacity:0;transform:scale(.97);filter:blur(8px);pointer-events:none}
.scene svg.art{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}
.hdr{position:absolute;left:64px;top:42px;right:64px}
.hdr .tag{font-family:var(--f-mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hdr h2{font-family:var(--f-disp);font-stretch:115%;font-weight:800;font-size:42px;margin:6px 0 0;letter-spacing:-.01em;color:var(--ink);line-height:1.1}

.eq{position:absolute;font-family:var(--f-math);font-size:36px;color:var(--ink);white-space:nowrap;line-height:1.25}
.eq i{font-style:italic}
.eq .w{font-family:var(--f-body);font-style:normal;font-size:.68em;color:var(--dim);letter-spacing:.01em}
.eq sub{font-size:.6em;vertical-align:-.3em;line-height:0;font-style:normal}
.eq sup{font-size:.6em;vertical-align:.62em;line-height:0}
.eq.s{font-size:30px}.eq.xs{font-size:25px}.eq.l{font-size:50px}.eq.xl{font-size:70px}
.eq.dim{color:var(--dim)}.eq.acc{color:var(--acc)}
.eq.box{border:2px solid var(--acc);border-radius:10px;padding:6px 18px;background:rgba(180,140,255,.07);box-shadow:0 0 40px rgba(180,140,255,.16)}
.c{translate:-50% 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.08;font-size:.9em}
.fr>span:first-child{border-bottom:.055em solid currentColor;padding:0 .22em .05em}
.fr>span:last-child{padding:.05em .22em 0}
.rt{white-space:nowrap}
.rt>.rad{border-top:.055em solid currentColor;padding:.04em .12em 0;margin-left:.03em;display:inline-block;line-height:1.15}
.unit{font-style:normal;color:var(--dim)}
.eq .hl,.eq.hl{color:var(--acc);text-shadow:0 0 24px rgba(180,140,255,.7)}
.nt{position:absolute;font-family:var(--f-body);font-size:26px;line-height:1.38;color:var(--dim);white-space:normal}
.nt b{color:var(--ink);font-weight:600}
.nt.acc{color:var(--acc)}
.nt i{font-family:var(--f-math)}
.pill.nc{text-transform:none;letter-spacing:.02em;font-size:18px}
.pill{position:absolute;font-family:var(--f-mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;padding:7px 15px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.panel{position:absolute;border:1.5px solid var(--line2);border-radius:14px;background:rgba(16,16,22,.72)}
.node{position:absolute;box-sizing:border-box;border:2px solid var(--line);border-radius:12px;padding:14px 18px;background:rgba(12,12,18,.9);font-family:var(--f-disp);font-stretch:108%;font-weight:700;font-size:27px;color:var(--ink);line-height:1.1}
.node small{display:block;font-family:var(--f-math);font-weight:400;font-size:22px;color:var(--dim);margin-top:6px}
.node small i{font-style:italic}.node small sub{font-size:.65em}
.node.acc{border-color:var(--acc);box-shadow:0 0 30px rgba(180,140,255,.18)}
.li{position:absolute;display:flex;gap:18px;align-items:baseline;font-size:28px;line-height:1.35;color:var(--dim);font-family:var(--f-body)}
.li .num{font-family:var(--f-mono);font-size:19px;color:var(--acc);border:1.5px solid var(--acc);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none;transform:translateY(-3px)}
.li b{color:var(--ink);font-weight:600}
.li i{font-family:var(--f-math)}
.hk{position:absolute;font-family:var(--f-mono);font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.hero{position:absolute;font-family:var(--f-disp);font-weight:900;font-stretch:112%;font-size:128px;letter-spacing:-.02em;line-height:1;color:var(--ink)}
.hsub{position:absolute;font-family:var(--f-body);font-size:31px;color:var(--dim)}
.card .cnum{position:absolute;left:140px;top:150px;font-family:var(--f-disp);font-weight:900;font-stretch:125%;font-size:150px;line-height:1;color:transparent;-webkit-text-stroke:2px var(--line)}
.card .csub{position:absolute;left:146px;top:338px;font-family:var(--f-mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.card .cttl{position:absolute;left:140px;top:372px;font-family:var(--f-disp);font-weight:800;font-stretch:116%;font-size:82px;letter-spacing:-.015em;line-height:1.02;color:var(--ink);max-width:1000px}

/* svg drawing */
.art .ln{stroke:var(--line);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.art .ln2{stroke:var(--line2);stroke-width:2.2;fill:none}
.art .dashl{stroke-dasharray:7 9}
.art .obj{fill:#111117;stroke:#a19faa;stroke-width:3}
.art .spr{fill:none;stroke:#cfcdd8;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.art .hatch{stroke:var(--line2);stroke-width:2}
.art text{font-family:var(--f-math);font-size:30px;fill:var(--ink)}
.art .lab{font-style:italic}
.art .sm{font-family:var(--f-body);font-size:22px;fill:var(--dim)}
.art .smacc{font-family:var(--f-body);font-size:22px;fill:var(--acc)}
.art .arr line{stroke:currentColor;stroke-width:4.5;stroke-linecap:round}
.art .arr polygon{fill:currentColor}
.art .arr text{fill:currentColor;font-style:italic;font-size:29px;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .dim line{stroke:var(--dim);stroke-width:1.6}
.art .dim text{fill:var(--dim);font-size:25px;font-style:italic;paint-order:stroke;stroke:#060608;stroke-width:6px}
.art .ang path{fill:none;stroke:var(--acc);stroke-width:2.2}
.art .ang text{fill:var(--acc);font-size:26px;font-style:italic}
.art .dot{fill:var(--ink)}

/* bars (energy diagrams) */
.bars{position:absolute;width:210px;font-family:var(--f-math)}
.btl{font-family:var(--f-disp);font-weight:800;font-stretch:110%;font-size:26px;text-align:center;margin-bottom:6px;color:var(--ink)}
.bcols{height:200px;display:flex;align-items:flex-end;justify-content:center;gap:12px;border-bottom:2px solid var(--line)}
.bc{width:50px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bf{width:100%;height:calc(var(--h,0) * 100%);border-radius:4px 4px 0 0;transition:height 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 26px -6px currentColor}
.bv{font-size:20px;color:var(--ink);margin-bottom:4px;white-space:nowrap;min-height:24px}
.bls{display:flex;justify-content:center;gap:12px;margin-top:6px}
.bls span{width:50px;text-align:center;font-style:italic;font-size:23px;color:var(--dim)}
.bls sub{font-size:.62em;font-style:normal}
.be{text-align:center;font-size:21px;margin-top:4px;color:var(--ink);min-height:28px;white-space:nowrap}
.be i{font-style:italic}.be sub{font-size:.6em;font-style:normal}.be sup{font-size:.6em}
.bars.sm .bcols{height:130px}.bars.sm .bc{width:42px}.bars.sm .bls span{width:42px}.bars.sm .btl{font-size:22px}

/* beat-driven visibility */
.scene [data-b]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .4s ease,color .4s ease}
.scene [data-b].vis{opacity:1;transform:none}
.scene .draw[data-b]{opacity:1;transform:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1),opacity .5s ease}
.scene .draw[data-b].vis{stroke-dashoffset:0}
.scene .gone,.scene .draw.gone{opacity:0!important}
.scene g.hl,.scene .node.hl,.scene .pill.hl{filter:drop-shadow(0 0 12px rgba(180,140,255,.8))}
@media (prefers-reduced-motion:reduce){
  #stage{animation:none}
  .scene,.scene [data-b]{transition-duration:.01s!important}
}
@media (max-width:560px){
  #cap{padding:12px 14px 14px}
  #chName{display:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="kick">FIS111 · Física General Mecánica</div><h1>Control 5: Torque, equilibrio y cuerpo rígido</h1></div>
    <p id="dur"></p>
  </header>

  <div id="player">
    <div id="frame">
      <div id="stage"></div>
      <div class="mark">FIS111</div>
      <button id="big" aria-label="Reproducir la clase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      <div id="resume" hidden><button id="bRes"></button><button id="bRes0">Desde el inicio</button></div>
    </div>
    <div id="ctl">
      <div id="bar" tabindex="0" role="slider" aria-label="Progreso de la clase" aria-valuemin="0"><div class="tr"></div><div class="fill"></div><div class="knob"></div><div id="tip" hidden></div></div>
      <div class="row">
        <button class="ic" id="bPrev" aria-label="Paso anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ic" id="bPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" fill="currentColor"><path id="icPlay" d="M7 4.5v15l12-7.5z"/></svg></button>
        <button class="ic" id="bNext" aria-label="Paso siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <span id="time">0:00 / 0:00</span>
        <span id="chName"></span>
        <button class="tx" id="bVoice" aria-pressed="false" title="Narración con la voz del navegador">Voz: no</button>
        <button class="tx" id="bSpeed" title="Velocidad">1×</button>
        <button class="ic" id="bFs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div id="cap"><div class="ct" id="capTag"></div><div class="cx" id="capTx"></div></div>

  <section>
    <h3>Capítulos</h3>

  <p class="keys">Atajos: <kbd>Espacio</kbd> pausa · <kbd>←</kbd> <kbd>→</kbd> paso anterior o siguiente · <kbd>F</kbd> pantalla completa. Los subtítulos son la narración completa; la voz es opcional.</p>
</div>

<script>
/* ================= helpers: math text ================= */
function fr(a,b){return `<span class="fr"><span>${a}</span><span>${b}</span></span>`}
function rt(x){return `<span class="rt">√<span class="rad">${x}</span></span>`}
function M(s){
  const keep=[];const K=h=>{keep.push(h);return '\u0001'+(keep.length-1)+'\u0001'};
  s=s.replace(/\{\{(.*?)\}\}/g,(_,a)=>K(`<span class="w">${a}</span>`))
     .replace(/\[([^\]]+)\]/g,(_,a)=>K(`<span class="unit">${a.replace(/\^(\d)/g,'<sup>$1</sup>')}</span>`))
     .replace(/_\{([^}]*)\}/g,(_,a)=>K(`<sub>${a}</sub>`))
     .replace(/_([A-Za-z0-9áéíóú]+)/g,(_,a)=>K(`<sub>${a}</sub>`))
     .replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^([0-9]+)/g,'<sup>$1</sup>');
  s=s.split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(/(^|[^A-Za-zÀ-ÿ\u0001])([A-Za-zμωθαδφ])(?![A-Za-zÀ-ÿ])/g,'$1<i>$2</i>')).join('');
  return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>keep[+i]);
}
/* ================= helpers: beat attrs ================= */
function ab(b){if(b==null||b===false)return '';if(typeof b!=='object')return ` data-b="${b}"`;let s='';if(b.b!=null)s+=` data-b="${b.b}"`;if(b.x!=null)s+=` data-x="${b.x}"`;if(b.d!=null)s+=` data-d="${b.d}"`;if(b.hl!=null)s+=` data-hl="${b.hl}"`;return s}
const hasB=b=>b!=null&&b!==false&&(typeof b!=='object'||b.b!=null);
/* ================= helpers: html ================= */
function Q(x,y,s,b,cls=''){return `<div class="eq ${cls}" style="left:${x}px;top:${y}px"${ab(b)}>${M(s)}</div>`}
function N(x,y,w,s,b,cls=''){return `<div class="nt ${cls}" style="left:${x}px;top:${y}px;width:${w}px"${ab(b)}>${s}</div>`}
function P(x,y,s,col,b,c=''){return `<div class="pill ${c}" style="left:${x}px;top:${y}px;color:var(--${col})"${ab(b)}>${s}</div>`}
function LI(x,y,n,s,b,w=1080){return `<div class="li" style="left:${x}px;top:${y}px;width:${w}px"${ab(b)}><span class="num">${n}</span><span>${s}</span></div>`}

function svg(s){return `<svg class="art" viewBox="0 0 1280 720">${s}</svg>`}
function bars(id,x,y,t,b,cls=''){return `<div class="bars ${cls}" id="${id}" style="left:${x}px;top:${y}px"${ab(b)}><div class="btl">${t}</div><div class="bcols">${['K','Ug','Ue'].map(k=>`<div class="bc"><span class="bv"></span><div class="bf" style="background:var(--${k});color:var(--${k})"></div></div>`).join('')}</div><div class="bls"><span>K</span><span>U<sub>g</sub></span><span>U<sub>e</sub></span></div><div class="be"></div></div>`}
function setB(r,id,v,lab,e){const el=r.querySelector('#'+id);if(!el)return;el.querySelectorAll('.bc').forEach((c,i)=>{c.style.setProperty('--h',v[i]||0);c.querySelector('.bv').textContent=lab&&lab[i]!=null?lab[i]:''});el.querySelector('.be').innerHTML=e?M(e):''}
/* ================= helpers: svg ================= */
const sb=s=>`<tspan font-size="19" dy="7" font-style="normal">${s}</tspan>`;
function ln(x1,y1,x2,y2,b,c='ln',st=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${st?` style="${st}"`:''}${ab(b)}/>`}
function pth(d,b,c='ln',st=''){return `<path d="${d}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${st?` style="${st}"`:''}${ab(b)}/>`}
function cir(cx,cy,r,b,c='ln'){return `<circle cx="${cx}" cy="${cy}" r="${r}" class="${c}${hasB(b)&&!/dashl/.test(c)?' draw':''}" pathLength="1"${ab(b)}/>`}
function dot(x,y,b,r=6){return `<circle cx="${x}" cy="${y}" r="${r}" class="dot"${ab(b)}/>`}
function tx(x,y,s,b,cls='',anc='middle'){return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="central" class="${cls}"${ab(b)}>${s}</text>`}
function ageo(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),h=17,w=.42;return{a,ex:x2-Math.cos(a)*h*.6,ey:y2-Math.sin(a)*h*.6,pts:`${x2},${y2} ${x2-h*Math.cos(a-w)},${y2-h*Math.sin(a-w)} ${x2-h*Math.cos(a+w)},${y2-h*Math.sin(a+w)}`,lx:x2+Math.cos(a)*26,ly:y2+Math.sin(a)*26}}
function arr(x1,y1,x2,y2,col,lab,b,lp,st=''){const g=ageo(x1,y1,x2,y2);const [lx,ly]=lp||[g.lx,g.ly];return `<g class="arr" style="color:var(--${col});${st}"${ab(b)}><line x1="${x1}" y1="${y1}" x2="${g.ex}" y2="${g.ey}"/><polygon points="${g.pts}"/>${lab?`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function darr(id,col,lab,b){return `<g class="arr" id="${id}" style="color:var(--${col})"${ab(b)}><line/><polygon/>${lab?`<text text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function setArr(r,id,x1,y1,x2,y2,lp){const e=r.querySelector('#'+id);if(!e)return;const g=ageo(x1,y1,x2,y2);const l=e.querySelector('line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',g.ex);l.setAttribute('y2',g.ey);e.querySelector('polygon').setAttribute('points',g.pts);const t=e.querySelector('text');if(t){const p=lp||[g.lx,g.ly];t.setAttribute('x',p[0]);t.setAttribute('y',p[1])}}
function blk(x,y,w,h,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" class="obj"/>${lab?tx(x+w/2,y+h/2,lab,null,'lab'):''}</g>`}
function ball(x,y,r,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><circle cx="${x}" cy="${y}" r="${r}" class="obj"/>${lab?tx(x,y,lab,null,'lab'):''}</g>`}
function gnd(x1,x2,y,b,red){let h='';for(let x=x1+12;x<=x2;x+=22)h+=`<line x1="${x}" y1="${y+2}" x2="${x-12}" y2="${y+15}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="ln"${red?' style="stroke:var(--roce)"':''}/>${h}</g>`}
function wall(x,y1,y2,b,side=-1){let h='';for(let y=y1+10;y<=y2;y+=20)h+=`<line x1="${x}" y1="${y}" x2="${x+side*13}" y2="${y+10}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" class="ln"/>${h}</g>`}
function ceil(x1,x2,y,b){let h='';for(let x=x1+12;x<=x2;x+=22)h+=`<line x1="${x}" y1="${y-2}" x2="${x-12}" y2="${y-15}" class="hatch"/>`;return `<g${ab(b)}><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="ln"/>${h}</g>`}
function springPts(x1,y1,x2,y2,n=9,w=15){const L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy,ny=ux,lead=Math.min(16,L*.12);const p=[[x1,y1],[x1+ux*lead,y1+uy*lead]];const m=2*n;for(let i=0;i<m;i++){const s=lead+(L-2*lead)*(i+.5)/m,sd=(i%2?-1:1)*w;p.push([x1+ux*s+nx*sd,y1+uy*s+ny*sd])}p.push([x2-ux*lead,y2-uy*lead],[x2,y2]);return p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}
function spr(id,x1,y1,x2,y2,b,n,w){return `<polyline${id?` id="${id}"`:''} class="spr" points="${springPts(x1,y1,x2,y2,n,w)}"${ab(b)}/>`}
function setSpr(r,id,x1,y1,x2,y2,n,w){const e=r.querySelector('#'+id);if(e)e.setAttribute('points',springPts(x1,y1,x2,y2,n,w))}
function dim(x1,y1,x2,y2,lab,b,lx,ly){const a=Math.atan2(y2-y1,x2-x1),nx=-Math.sin(a)*9,ny=Math.cos(a)*9;return `<g class="dim"${ab(b)}><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x1+nx}" y2="${y1+ny}"/><line x1="${x2-nx}" y1="${y2-ny}" x2="${x2+nx}" y2="${y2+ny}"/>${lab?`<text x="${lx??(x1+x2)/2}" y="${ly??(y1+y2)/2}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
function arc(cx,cy,r,a1,a2,lab,b,lr){lr=lr??r+24;const R=Math.PI/180,P=a=>[cx+r*Math.cos(a*R),cy-r*Math.sin(a*R)];const [x1,y1]=P(a1),[x2,y2]=P(a2);const lg=Math.abs(a2-a1)>180?1:0,sw=a2>a1?0:1,am=(a1+a2)/2*R;return `<g class="ang"${ab(b)}><path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${lg} ${sw} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>${lab?`<text x="${(cx+lr*Math.cos(am)).toFixed(1)}" y="${(cy-lr*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
/* ================= helpers: motion ================= */
function pick(j,o){let v;for(const k of Object.keys(o).map(Number).sort((a,b)=>a-b))if(k<=j)v=o[k];return v}
function tween(r,key,dur,fn){r._tw=r._tw||{};const id={};r._tw[key]=id;const t0=performance.now();const e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;function st(now){if(r._tw[key]!==id)return;const p=Math.min(1,(now-t0)/(dur*1000));fn(e(p));if(p<1)requestAnimationFrame(st)}requestAnimationFrame(st)}
function animv(r,key,to,dur,fn,instant){r._v=r._v||{};const from=r._v[key];r._v[key]=to;if(instant||from==null){fn(to);return}const isA=Array.isArray(to);tween(r,key,dur,p=>fn(isA?to.map((v,i)=>from[i]+(v-from[i])*p):from+(to-from)*p))}
function setT(r,id,x,y){const e=r.querySelector('#'+id);if(e)e.setAttribute('transform',`translate(${x},${y})`)}

/* ================= content registry ================= */
const CHS=[],SC=[];let _ch=null;
function CH(title,sub,narr){_ch={title,sub,scenes:[],i:CHS.length};CHS.push(_ch);if(narr)S({card:true,title,beats:[narr]})}

</script>
<script>

function vc(s){return `<span class="vc">${s}</span>`}
function cball(x,y,r,col,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><circle cx="${x}" cy="${y}" r="${r}" style="fill:#101016;stroke:var(--${col});stroke-width:3.5"/>${lab?`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" class="lab" style="fill:var(--${col});font-size:${Math.max(18,Math.min(30,r*.9))}px">${lab}</text>`:''}</g>`}
function cbox(x,y,w,h,col,lab,b,id){return `<g${id?` id="${id}"`:''}${ab(b)}><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" style="fill:#101016;stroke:var(--${col});stroke-width:3.5"/>${lab?`<text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" dominant-baseline="central" class="lab" style="fill:var(--${col});font-size:24px">${lab}</text>`:''}</g>`}
/* car drawn with bottom-center at (0,0); facing right */
function carG(w,col,lab){const h=w*.3;return `<rect x="${-w/2}" y="${-h-w*.1}" width="${w}" height="${h}" rx="8" style="fill:#101016;stroke:var(--${col});stroke-width:3.5"/><path d="M${-w*.28} ${-h-w*.1} L${-w*.18} ${-h-w*.3} L${w*.16} ${-h-w*.3} L${w*.3} ${-h-w*.1}" style="fill:#101016;stroke:var(--${col});stroke-width:3"/><circle cx="${-w*.28}" cy="${-w*.1}" r="${w*.1}" class="obj"/><circle cx="${w*.28}" cy="${-w*.1}" r="${w*.1}" class="obj"/>${lab?`<text x="0" y="${-h/2-w*.1}" text-anchor="middle" dominant-baseline="central" style="fill:var(--${col});font-family:var(--f-body);font-size:${Math.round(w*.15)}px">${lab}</text>`:''}`}
function car(x,y,w,col,lab,b,id){return `<g${ab(b)}><g${id?` id="${id}"`:''} transform="translate(${x},${y})">${carG(w,col,lab)}</g></g>`}
function axesG(x,y,L,b,lx='î',ly='ĵ'){return `<g${ab(b)}>${arr(x,y,x+L,y,'dim','')}${arr(x,y,x,y-L,'dim','')}${tx(x+L+22,y,lx,null,'lab')}${tx(x,y-L-22,ly,null,'lab')}</g>`}
function kf(t,P){if(t<=P[0][0])return P[0][1];for(let i=1;i<P.length;i++){if(t<=P[i][0]){const a=P[i-1],b=P[i],u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*u}}return P[P.length-1][1]}
/* 1D position: contact at time tc at xc, speed before vb, after va (px/s) */
function p1d(t,tc,xc,vb,va){return xc+(t<tc?vb:va)*(t-tc)}
function vis(r,id,on){const e=r.querySelector('#'+id);if(e)e.style.opacity=on?1:0}

<script>
/* ================= helpers extra (cuerpo rígido) ================= */
const RAD=Math.PI/180;
/* point from (x,y) at math angle a (deg, CCW from +x) and length L, in svg coords */
function PT(x,y,a,L){return [x+L*Math.cos(a*RAD),y-L*Math.sin(a*RAD)]}
function beam(x1,y1,x2,y2,w,b,cls='',id){const L=Math.hypot(x2-x1,y2-y1)||1,nx=-(y2-y1)/L*w/2,ny=(x2-x1)/L*w/2;
  const p=[[x1+nx,y1+ny],[x2+nx,y2+ny],[x2-nx,y2-ny],[x1-nx,y1-ny]].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  return `<polygon${id?` id="${id}"`:''} points="${p}" class="bm ${cls}"${ab(b)}/>`}
function piv(x,y,b,r=9){return `<circle cx="${x}" cy="${y}" r="${r}" class="pv"${ab(b)}/>`}
/* hinge on a wall/ceiling: small triangle support */
function tri(x,y,b,dir='up'){const s=22;let p;if(dir==='up')p=`${x},${y} ${x-s},${y+s*1.3} ${x+s},${y+s*1.3}`;else if(dir==='down')p=`${x},${y} ${x-s},${y-s*1.3} ${x+s},${y-s*1.3}`;else if(dir==='right')p=`${x},${y} ${x-s*1.3},${y-s} ${x-s*1.3},${y+s}`;else p=`${x},${y} ${x+s*1.3},${y-s} ${x+s*1.3},${y+s}`;
  return `<g${ab(b)}><polygon points="${p}" style="fill:#101016;stroke:#a19faa;stroke-width:2.5"/>${piv(x,y,null,7)}</g>`}
/* curved arrow (torque / rotation), angles in math degrees */
function arcA(cx,cy,r,a1,a2,col,lab,b,lp){const s=Math.sign(a2-a1)||1;const E=a=>PT(cx,cy,a,r);const [x1,y1]=E(a1),[xe,ye]=E(a2-s*5),[xp,yp]=E(a2-s*14),[x2,y2]=E(a2);
  const g=ageo(xp,yp,x2,y2);const lg=Math.abs(a2-a1)>180?1:0,sw=a2>a1?0:1;const am=(a1+a2)/2;const [lx,ly]=lp||PT(cx,cy,am,r+30);
  return `<g class="arr" style="color:var(--${col})"${ab(b)}><path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${lg} ${sw} ${xe.toFixed(1)} ${ye.toFixed(1)}" style="fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round"/><polygon points="${g.pts}"/>${lab?`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central">${lab}</text>`:''}</g>`}
/* out of screen (dot) / into screen (cross) */
function ozz(x,y,type,col,b,r=15){return `<g class="ozz" style="color:var(--${col})"${ab(b)}><circle cx="${x}" cy="${y}" r="${r}"/>${type==='out'?`<circle cx="${x}" cy="${y}" r="4.5" class="cd"/>`:`<line x1="${x-r*.62}" y1="${y-r*.62}" x2="${x+r*.62}" y2="${y+r*.62}"/><line x1="${x+r*.62}" y1="${y-r*.62}" x2="${x-r*.62}" y2="${y+r*.62}"/>`}</g>`}
/* wheel/pulley with spokes that can rotate: id on inner group */
function wheel(cx,cy,r,b,id,col){const c=col?`style="fill:#101016;stroke:var(--${col});stroke-width:3.5"`:'class="obj"';
  return `<g${ab(b)}><g${id?` id="${id}"`:''}><circle cx="${cx}" cy="${cy}" r="${r}" ${c}/><line x1="${cx-r*.8}" y1="${cy}" x2="${cx+r*.8}" y2="${cy}" class="ln2"/><line x1="${cx}" y1="${cy-r*.8}" x2="${cx}" y2="${cy+r*.8}" class="ln2"/></g>${piv(cx,cy,null,6)}</g>`}
function rot(r,id,deg,cx,cy){const e=r.querySelector('#'+id);if(e)e.setAttribute('transform',`rotate(${deg.toFixed(2)} ${cx} ${cy})`)}
/* string + block hanging from (x,y) */
function hang(x,y,len,w,h,lab,b,col){return `<g${ab(b)}><line x1="${x}" y1="${y}" x2="${x}" y2="${y+len}" class="ln2" style="stroke:#cfcdd8"/>${col?cbox(x-w/2,y+len,w,h,col,lab):blk(x-w/2,y+len,w,h,lab)}</g>`}
/* small label text in body font */
function lb(x,y,s,b,col='dim',anc='middle',sz=22){return `<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="central" style="font-family:var(--f-body);font-size:${sz}px;fill:var(--${col})"${ab(b)}>${s}</text>`}
function tbl(x,y,rows,b,w){return `<table class="tbl" style="left:${x}px;top:${y}px${w?';width:'+w+'px':''}"${ab(b)}>${rows.map(r=>`<tr><td>${r[0]}</td><td>${M(r[1])}</td></tr>`).join('')}</table>`}
</script>

${N(400,622,800,'Como en las clases 19 y 20. Si el enunciado da otro valor (la ayudantía 10 usa 9,8), manda el enunciado.',6)}`,
beats:[
`Este es el mapa. Todo parte con una idea nueva: el torque. El torque mide qué tan capaz es una fuerza de hacer girar un cuerpo. Es la clase 19.`,
`Con el torque aparece la segunda condición de equilibrio. Hasta ahora, un cuerpo estaba en equilibrio si la suma de fuerzas era cero. Ahora además pedimos que la suma de torques sea cero. Eso es la clase 19, la clase 20 y toda la ayudantía 10.`,
`Si la suma de torques no es cero, el cuerpo gira cada vez más rápido. Eso es la dinámica de rotación, la clase 21. La ecuación es suma de torques igual a I por alfa. Es el "Newton" de las rotaciones.`,
`En esa ecuación aparece I, el momento de inercia. Es la "masa" de las rotaciones: dice qué tan difícil es hacer girar algo. Lo vemos en las clases 21 y 22.`,
`Después, la rodadura: una rueda que avanza y gira a la vez, sin resbalar. La clave es una condición que conecta las dos cosas: la velocidad del centro es R por omega. Clase 22.`,
`Y al final, la energía de un cuerpo rígido: un cuerpo que gira también tiene energía cinética, la de rotación. Clase 23.`,
`Una convención: usamos g igual a 10 metros por segundo al cuadrado, porque con ese valor salen exactos los resultados de las clases 19 y 20. Pero si un enunciado te da otro valor, como el problema 2 de la ayudantía 10, que usa 9,8, usas el del enunciado. Siempre manda el enunciado.`]
});

S({title:'Torque: la definición',
html:(()=>{const O=[230,520],th=60,ar=24,Pp=PT(O[0],O[1],ar,420),Fe=PT(Pp[0],Pp[1],ar+th,170),ex=PT(Pp[0],Pp[1],ar,130);
return svg(`

${arr(O[0],O[1],Pp[0],Pp[1],'line','r',1,[PT(O[0],O[1],ar,210)[0],PT(O[0],O[1],ar,210)[1]-30])}
${dot(Pp[0],Pp[1],1)}${lb(Pp[0]-28,Pp[1]-30,'punto donde se aplica F',1,'dim','end',20)}
${ln(Pp[0],Pp[1],ex[0],ex[1],2,'ln2 dashl')}
${arr(Pp[0],Pp[1],Fe[0],Fe[1],'ten','F',2)}
${arc(Pp[0],Pp[1],52,ar,ar+th,'θ',2,82)}
${arcA(O[0],O[1],90,0,70,'tor','τ',3,[O[0]+60,O[1]-118])}
`)
+Q(760,170,'τ = r × F',3,'l')
+N(760,250,450,'r: <b>desde el eje</b> hasta el punto donde actúa la fuerza.',1)
+Q(760,350,'|τ| = r F sin θ',4,'l box')
+N(760,440,460,'θ: ángulo entre <b>r</b> y <b>F</b>, puestos cola con cola.',2)
+Q(760,530,'[N·m]',5,'s')
+N(860,534,350,'unidad del torque',5)
+N(760,600,460,'θ = 0°: sin θ = 0, no gira. &nbsp;θ = 90°: sin θ = 1, máximo.',6)})(),
beats:[
`Vamos a la definición. Primero necesitamos un eje de giro, un punto O. Es el punto alrededor del cual el cuerpo gira, o podría girar: la bisagra de la puerta, el pivote de un balancín.`,
`Luego dibujamos un vector r. El vector r sale desde el eje de giro y llega hasta el punto exacto donde se aplica la fuerza. Es muy importante: r siempre parte en el eje, no en otro lado.`,
`En ese punto actúa la fuerza F. Ahora necesitamos el ángulo theta entre r y F. Para medirlo, prolongamos r con una línea punteada, y medimos el ángulo entre esa prolongación y la fuerza. Es decir, el ángulo entre los dos vectores puestos cola con cola.`,
`El torque, la letra griega tau, se define como el producto cruz entre r y F: tau igual a r cruz F. El orden importa: primero r, después F.`,
`Para la magnitud del torque usamos: tau igual a r por F por el seno de theta. Esta es la fórmula que más vas a usar en el control.`,
`La unidad es newton por metro, porque es una fuerza, en newton, por una distancia, en metros.`,
`Mira qué pasa con el seno. Si theta es cero, la fuerza apunta en la misma línea que r, el seno es cero y el torque es cero: esa fuerza no hace girar nada. Si theta es 90 grados, el seno es uno y el torque es máximo. Por eso la puerta se empuja perpendicular.`]
});

S({title:'Dos formas de calcular el mismo torque',
html:(()=>{const O=[220,540],th=60,ar=24,Pp=PT(O[0],O[1],ar,420),fd=ar+th;const ux=Math.cos(fd*RAD),uy=-Math.sin(fd*RAD);
const A1=[Pp[0]-ux*330,Pp[1]-uy*330],A2=[Pp[0]+ux*200,Pp[1]+uy*200];
/* foot of perpendicular from O to line of action */
const t=((O[0]-Pp[0])*ux+(O[1]-Pp[1])*uy),Fp=[Pp[0]+ux*t,Pp[1]+uy*t];
const Fe=PT(Pp[0],Pp[1],fd,170);const perp=PT(Pp[0],Pp[1],ar+90,170*Math.sin(th*RAD)),par=PT(Pp[0],Pp[1],ar,170*Math.cos(th*RAD));
return svg(`
${piv(O[0],O[1],0)}${tx(O[0]-24,O[1]+26,'O',0,'lab')}
${arr(O[0],O[1],Pp[0],Pp[1],'line','r',0,[PT(O[0],O[1],ar,240)[0],PT(O[0],O[1],ar,240)[1]+28])}
${arr(Pp[0],Pp[1],Fe[0],Fe[1],'ten','F',0)}
${ln(A1[0],A1[1],A2[0],A2[1],1,'ln2 dashl')}${lb(A1[0]+10,A1[1]-26,'línea de acción de F',1,'dim','start',20)}
${ln(O[0],O[1],Fp[0],Fp[1],2,'ln','stroke:var(--acc)')}${tx((O[0]+Fp[0])/2-26,(O[1]+Fp[1])/2-8,'d',2,'lab')}
<g data-b="4">${arr(Pp[0],Pp[1],perp[0],perp[1],'acel','F'+sb('⊥'),null,[perp[0]-30,perp[1]-12])}${ln(Pp[0],Pp[1],par[0],par[1],null,'ln2 dashl')}</g>
`)
+N(760,170,450,'<b>Forma 1: brazo de palanca.</b> d es la distancia <b>perpendicular</b> desde O hasta la línea de acción.',1)
+Q(760,290,'d = r sin θ   ⇒   τ = F d',3,'s box')
+N(760,380,450,'<b>Forma 2: componente perpendicular.</b> Solo la parte de F perpendicular a r hace girar.',4)
+Q(760,500,'F_{⊥} = F sin θ   ⇒   τ = r F_{⊥}',5,'s box')
+N(760,590,450,'Las dos dan <b>r F sin θ</b>. Usa la que sea más cómoda.',6)})(),
beats:[
`La misma fórmula se puede leer de dos maneras, y en los ejercicios conviene saber las dos. Aquí tenemos el eje O, el vector r y la fuerza F.`,
`Forma uno: el brazo de palanca. Prolongamos la fuerza hacia los dos lados con una línea punteada. Esa línea se llama línea de acción de la fuerza.`,
`Ahora medimos la distancia más corta desde el eje O hasta esa línea, es decir, perpendicular a la línea. Esa distancia, d, se llama brazo de palanca.`,
`Con trigonometría, en el triángulo rectángulo que se forma, d es igual a r por el seno de theta. Entonces el torque es simplemente fuerza por brazo: tau igual a F por d. Esta forma es la mejor cuando las fuerzas son verticales, como los pesos: el brazo es la distancia horizontal al eje.`,
`Forma dos: descomponer la fuerza. Separamos F en una parte a lo largo de r, que no hace girar nada porque tira directo hacia el eje o lo empuja, y una parte perpendicular a r, que es la que hace girar.`,
`La parte perpendicular vale F por seno de theta. Entonces el torque es r por F perpendicular.`,
`Fíjate que las dos formas dan exactamente lo mismo: r por F por seno de theta. Solo cambia cómo agrupas los factores. Usa la que te resulte más cómoda en cada problema.`]
});

beats:[
`En la clase aparece esta pregunta: una puerta, vista desde arriba, con tres fuerzas, F uno, F dos y F tres. ¿Cuál permite rotar la puerta? ¿Cuál es la más eficiente? Pensémoslo con la fórmula.`,
`F uno apunta a lo largo de la puerta, directo hacia la bisagra. Su línea de acción pasa por el eje, así que el brazo de palanca es cero. Con la fórmula: el ángulo entre r y F es 180 grados, y el seno de 180 es cero. Torque cero. Esa fuerza solo aprieta la puerta contra la bisagra, no la abre.`,

`Formalicemos. Un cuerpo rígido es un cuerpo con forma y tamaño definidos, que no se deforma, como una barra de metal o una viga. Para él necesitamos dos condiciones de equilibrio.`,
`La primera, el equilibrio traslacional: la suma de fuerzas es cero. En dos dimensiones son dos ecuaciones: la suma en x es cero y la suma en y es cero. Esto ya lo conocías.`,
`La segunda, la nueva, el equilibrio rotacional: la suma de todos los torques es cero. Y algo muy útil: si el cuerpo está en equilibrio, la suma de torques es cero respecto de cualquier punto. Tú eliges el punto.`,

`Hasta ahora todo estaba quieto, con suma de torques igual a cero. ¿Qué pasa si la suma de torques no es cero? Entonces el cuerpo empieza a girar, y cada vez más rápido.`,
`Igual que una fuerza neta produce una aceleración, un torque neto produce una aceleración angular, que se escribe con la letra alfa.`,
`Recordemos las variables de rotación. Theta es el ángulo girado, en radianes. Omega es la velocidad angular: cuánto ángulo gira por segundo, en radianes por segundo. Y alfa es la aceleración angular: cuánto cambia omega cada segundo, en radianes por segundo al cuadrado.`,
`Un punto del cuerpo que está a distancia R del eje se mueve en un círculo. Su rapidez es v igual a R omega. Y su aceleración tangencial, la que lo hace ir más rápido, es a T igual a R alfa. Estas dos relaciones las vamos a usar todo el tiempo.`,
`Y si el torque neto es constante, la aceleración angular también es constante, igual que con fuerza constante y aceleración constante.`],

beats:[
`¿De dónde sale la ecuación? Partamos con un caso simple: una partícula de masa m que gira en un círculo de radio R alrededor de un eje.`,
`Sobre ella actúa una fuerza neta, que podemos separar en dos partes: una que apunta al centro, la fuerza centrípeta F c, que la mantiene en el círculo, y una tangente al círculo, F T, que la hace ir más rápido.`,
`La fuerza centrípeta apunta directo al eje: su línea de acción pasa por el eje y su torque es cero. La que hace girar es solo la tangencial.`,
`El torque de la fuerza tangencial es R por F T, porque es perpendicular al radio. Por Newton, F T es m por a T. Y la aceleración tangencial es R alfa. Reemplazando: tau es R por m por R alfa, o sea m R cuadrado por alfa.`,
`Un cuerpo rígido es un montón de partículas, cada una con su masa y su distancia al eje, pero todas con el mismo alfa, porque el cuerpo gira entero. Sumando todas: la suma de torques es la suma de m r cuadrado, por alfa.`,
`A esa suma de m r cuadrado le ponemos un nombre: el momento de inercia, I. Y llegamos a la ecuación central: la suma de torques es I por alfa. Es la segunda ley de Newton para las rotaciones.`]

`En la rodadura, un cuerpo, como una rueda, hace dos movimientos al mismo tiempo: avanza y gira.`,
`Si miramos solo el centro de la rueda, el centro de masa, se mueve en línea recta, como una partícula. Para él usamos Newton: la suma de fuerzas es M por la aceleración del centro de masa.`,
`Pero si miramos un punto del borde, como el punto morado, su camino es mucho más raro: dibuja una curva llamada cicloide. Esa curva es la suma de avanzar y girar. Para el giro usamos la suma de torques igual a I alfa, respecto del centro de masa.`],
loop(st,r){const T=6,c=st%T,x=RL.x0+(RL.x1-RL.x0)*Math.min(1,c/5);const f=(x-RL.x0)/RL.R;const e=r.querySelector('#rl');if(e)e.setAttribute('transform',`translate(${x.toFixed(1)},${RL.y}) rotate(${(f*180/Math.PI).toFixed(1)})`)}

<script>
function bars3(id,x,y,t,b,labs,cls=''){const K=['K','Ug','vel'];labs=labs||['K<sub>rot</sub>','U<sub>g</sub>','K<sub>tras</sub>'];
return `<div class="bars ${cls}" id="${id}" style="left:${x}px;top:${y}px"${ab(b)}><div class="btl">${t}</div><div class="bcols">${K.map(k=>`<div class="bc"><span class="bv"></span><div class="bf" style="background:var(--${k});color:var(--${k})"></div></div>`).join('')}</div><div class="bls">${labs.map(l=>`<span>${l}</span>`).join('')}</div><div class="be"></div></div>`}

${Q(660,300,'K_{rot} = ½ I_{CM} ω^2',1,'s')}
${N(660,360,560,'por el <b>giro</b> en torno al centro de masa',1)}
${Q(660,440,'K = ½ M v_{CM}^2 + ½ I_{CM} ω^2',2,'s box')}
${Q(660,540,'K = ½ I_P ω^2',3,'s')}
${N(660,600,560,'P: punto de contacto. I<sub>P</sub> = I<sub>CM</sub> + M R² y v = R ω dan lo mismo.',3)}`,
beats:[
`Una rueda que rueda tiene dos tipos de energía cinética. La primera es la de traslación, la que ya conocías: un medio M v cuadrado, donde v es la rapidez del centro de masa.`,
`La segunda es nueva: la energía cinética de rotación. Es un medio de I por omega al cuadrado, con I respecto del centro de masa. Fíjate en el parecido: la masa se cambia por I, y la velocidad por omega.`,
`La energía cinética total es la suma de las dos. Un medio M v cuadrado más un medio I omega cuadrado.`,
`Hay otra forma de escribirlo: toda la energía como rotación pura alrededor del punto de contacto P, el eje instantáneo: un medio I P omega cuadrado. Es lo mismo: si reemplazas I P por I del centro de masa más M R cuadrado, y usas v igual a R omega, te vuelve a aparecer la suma de las dos.`],
loop(st,r){const c=st%5,x=170+380*Math.min(1,c/4.2);const e=r.querySelector('#ek');if(e)e.setAttribute('transform',`translate(${x.toFixed(1)},450) rotate(${((x-170)/70*180/Math.PI).toFixed(1)})`)}
});

${Q(560,630,`ω = √(3g/L)`,4,'s box')}`,
beats:[
`Primera forma de resolverlo: tratar todo como una rotación pura en torno al pivote. Ponemos el nivel cero de altura donde queda el centro de masa en la posición vertical, a L medios bajo el pivote. Al inicio, la barra está horizontal: el centro de masa está L medios más arriba. Su energía es solo potencial: M g L medios. No se mueve, así que no hay energía cinética.`,

`Como la barra gira en torno al pivote fijo, toda su energía cinética es de rotación respecto del pivote: un medio de I pivote por omega cuadrado. Y I de una barra respecto de un extremo es un tercio M L cuadrado. Multiplicando: un sexto M L cuadrado omega cuadrado.`,

});

on(j,r){setB(r,'pcb1',j>=1?[0,.9,0]:[0,0,0],null,j>=1?'m g h':'');setB(r,'pcb2',j>=2?[.15,0,.75]:[0,0,0],null,j>=2?'K_{rot} + K_{tras}':'')},
loop(st,r){const c=st%4,u=Math.min(1,c/3);const d=260*u*u;const e=r.querySelector('#pc_b');if(e)e.setAttribute('transform',`translate(${PC.c[0]+PC.R},${(330+d).toFixed(1)})`);const s=r.querySelector('#pc_s');if(s)s.setAttribute('y2',(330+d).toFixed(1));rot(r,'pc',(d/PC.R*180/Math.PI)%360,PC.c[0],PC.c[1])}
});

S({title:'La polea y el cajón: la rapidez',
html:`
${Q(90,165,'m g h = ½ m v^2 + ½ I ω^2',0,'s')}
${Q(90,240,`I = ½ M R^2     ω = ${fr('v','R')}`,1,'s')}
${Q(90,330,`½ I ω^2 = ½ · ½ M R^2 · ${fr('v^2','R^2')} = ¼ M v^2`,2,'s')}
${Q(90,430,'m g h = ½ (m + M/2) v^2',3,'s')}
${Q(90,520,`v = √(${fr('2 m g h','m + M/2')}) = √(${fr('2 · 2,5 · 10 · 2,5','3,0')})`,4,'s')}
${Q(90,630,'v ≈ 6,45 [m/s]',5,'box')}
${N(720,170,500,'R se cancela: no hacía falta.',2)}
${N(720,520,500,'Con g = 9,8: v ≈ 6,39 m/s.',5)}
${N(720,600,500,'De 62,5 J: el cajón se lleva 52,1 J y la polea 10,4 J.',6,'acc')}`,
beats:[
`Parte b: la ecuación de balance de energía. Lo que había al inicio es igual a lo que hay al final: m g h es igual a un medio m v cuadrado del cajón, más un medio I omega cuadrado de la polea.`,
`La polea es un disco: I es un medio M R cuadrado. Y la cuerda no resbala: el borde de la polea se mueve igual que la cuerda y el cajón, así que omega es v sobre R.`,
`La energía de la polea: un medio por un medio M R cuadrado por v cuadrado sobre R cuadrado. Las R se cancelan y queda un cuarto M v cuadrado. Por eso el radio de la polea no hacía falta.`,
`La ecuación queda: m g h igual a un medio de m más M medios, por v cuadrado. Es como si el cajón arrastrara una masa extra de M medios.`,
`Despejamos v: la raíz de 2 m g h dividido por m más M medios. Con números: 2 por 2,5 por 10 por 2,5, dividido por 2,5 más 0,5, que es 3,0.`,
`Arriba da 125. Dividido por 3 da 41,7. La raíz: 6,45 metros por segundo. Si usas g igual a 9,8, da 6,39.`,
`Y para revisar el reparto: al inicio había 2,5 por 10 por 2,5, o sea 62,5 joule. Al final, el cajón tiene un medio por 2,5 por 41,7: 52,1 joule. Y la polea un cuarto por 1 por 41,7: 10,4 joule. La suma da 62,5. Todo cuadra.`]
});

CH('Resumen final','Todo el control','Capítulo final: las fórmulas, las recetas y los errores que más puntos cuestan. Guárdate esto para el viernes 13.');

S({title:'Las fórmulas',
html:`
${tbl(90,160,[['torque','τ = r F sin θ = F d'],['equilibrio','ΣF = 0,  Στ = 0'],['dinámica','ΣF = M a_{CM},  Στ = I α'],['inercia','I = Σ m r^2,  I_O = I_{CM} + M d^2']],0,560)}
${tbl(700,160,[['rodadura','v = R ω,  a = R α'],['cuerda en polea','a = R α'],['energía','K = ½ M v^2 + ½ I ω^2'],['I típicos','aro M R^2, disco ½ M R^2']],1,520)}
${N(90,500,1100,'Pregunta por <b>fuerzas o aceleraciones</b>: Newton y torques. Pregunta por <b>velocidades</b>: energía.',2,'acc')}`,
beats:[
`Las fórmulas del control. El torque: r F seno theta, o fuerza por brazo de palanca. El equilibrio: suma de fuerzas cero y suma de torques cero. La dinámica: suma de fuerzas igual a M por la aceleración del centro de masa, y suma de torques igual a I alfa. Y el momento de inercia, con el teorema de ejes paralelos.`,
`Para rodadura, la condición: v igual a R omega y a igual a R alfa. La misma condición vale para una cuerda que no resbala sobre una polea. Y la energía: traslación más rotación.`,
`Y la regla para elegir herramienta: si te preguntan fuerzas o aceleraciones, usa Newton y torques. Si te preguntan velocidades, usa energía. Muchas veces se pueden usar las dos, como en la polea con cajón: con dinámica sale a igual a 8,33, y v cuadrado igual a 2 a h da el mismo 6,45.`]
});

${LI(90,165,1,'<b>r parte en el eje</b>, y θ es el ángulo entre r y F, no con la horizontal.',0)}

${LI(90,305,3,'Fuerzas verticales: el brazo es la <b>distancia horizontal</b> al eje.',2)}
${LI(90,375,4,'Polea con masa: <b>T₁ ≠ T₂</b>. Hazle su propio DCLE.',3)}

beats:[

`Dos: para los torques, elige el punto donde actúan las fuerzas que no conoces y no te preguntan, como la reacción de un pivote. Te ahorra muchas cuentas.`,
`Tres: cuando las fuerzas son verticales, como los pesos, el brazo de palanca es la distancia horizontal al eje. En una viga inclinada eso es la distancia por coseno del ángulo.`,

</script>
<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'),frame=$('#frame'),player=$('#player'),bar=$('#bar'),fill=bar.querySelector('.fill'),knob=bar.querySelector('.knob'),tip=$('#tip');
const big=$('#big'),bPlay=$('#bPlay'),icPlay=$('#icPlay'),bVoice=$('#bVoice'),bSpeed=$('#bSpeed'),bFs=$('#bFs'),ctl=$('#ctl'),cap=$('#cap');
const KEY='fis111-c5-pos-v1';
let BE=[],TOTAL=0,g=0,t=0,playing=false,speed=1,voice=false,vDone=true,cur=null,curRoot=null,started=false,dragging=false,vTimer=null,sayTok=null,lastSave=0;
const SPEEDS=[.75,1,1.25,1.5,2];

/* timeline */
SC.forEach(s=>{s.start=TOTAL;s.beats.forEach((txt,j)=>{const w=txt.split(/\s+/).length;const d=Math.max(4.5,w*.37+1.6);BE.push({s:s.i,j,txt,d,st:TOTAL});TOTAL+=d});s.end=TOTAL});
CHS.forEach(c=>c.start=c.scenes[0].start);
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
$('#dur').textContent=`${CHS.length-1} capítulos · ${BE.length} pasos · ${fmt(TOTAL)}`;
CHS.forEach(c=>{if(c.start>0){const k=document.createElement('div');k.className='tick';k.style.left=(c.start/TOTAL*100)+'%';bar.appendChild(k)}});
const chBox=$('#chs');
CHS.forEach(c=>{const b=document.createElement('button');b.innerHTML=`<span class="n">${String(c.i).padStart(2,'0')}<br>${fmt(c.start)}</span><span><span class="t">${c.title}</span><span class="s">${c.sub}</span></span>`;b.onclick=()=>{go(idxAt(c.start+.01),0);if(!started)play();player.scrollIntoView({behavior:'smooth',block:'start'})};c.btn=b;chBox.appendChild(b)});
function idxAt(T){let lo=0,hi=BE.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(BE[m].st<=T)lo=m;else hi=m-1}return lo}

/* scenes */
function hdr(sc){return `<div class="hdr"><div class="tag">${sc.ch.sub} · ${sc.ch.title}</div><h2>${sc.title}</h2></div>`}
function card(c){return `<div class="card"><div class="cnum" data-b="0">${String(c.i).padStart(2,'0')}</div><div class="csub" data-b="0" data-d=".15">${c.sub}</div><div class="cttl" data-b="0" data-d=".3"${c.title.length>17?' style="font-size:62px"':''}>${c.title}</div>${svg(ln(146,520,1140,520,{b:0,d:.4},'ln','stroke:var(--acc);stroke-width:2'))}</div>`}
function mount(sc){
  const old=curRoot;if(old){old.classList.add('out');setTimeout(()=>old.remove(),1100)}
  const r=document.createElement('div');r.className='scene pre';
  r.innerHTML=sc.card?card(sc.ch):((sc.noHdr?'':hdr(sc))+sc.html);
  stage.appendChild(r);r._j=-1;cur=sc;curRoot=r;r.getBoundingClientRect();
  requestAnimationFrame(()=>r.classList.remove('pre'));
}
function apply(j,mnt){
  const r=curRoot,sc=cur;let k=0;
  r.querySelectorAll('[data-b]').forEach(el=>{const b=+el.dataset.b,want=b<=j,has=el.classList.contains('vis');
    if(want&&!has){const d=(mnt?.35:.05)+(+el.dataset.d||0)+(b===j?Math.min(k++,8)*.12:0);el.style.transitionDelay=d.toFixed(2)+'s';el._p=true}
    else if(!want){el._p=false;if(has){el.style.transitionDelay='0s';el.classList.remove('vis')}}});
  r._j=j;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.querySelectorAll('[data-b]').forEach(el=>{if(el._p&&+el.dataset.b<=r._j){el.classList.add('vis');el._p=false}})}));
  r.querySelectorAll('[data-x]').forEach(el=>el.classList.toggle('gone',j>=+el.dataset.x));
  r.querySelectorAll('[data-hl]').forEach(el=>el.classList.toggle('hl',el.dataset.hl.split(',').map(Number).includes(j)));
  if(sc.on){try{sc.on(j,r,mnt)}catch(e){console.error(e)}}
}
function go(i,tt=0,o={}){
  i=Math.max(0,Math.min(BE.length-1,i));const b=BE[i],sc=SC[b.s];let m=false;
  if(cur!==sc){mount(sc);m=true}
  const same=!m&&i===g&&curRoot._j===b.j;
  g=i;t=tt;if(!same)apply(b.j,m);
  $('#capTag').textContent=sc.ch.title+(sc.card?'':' · '+sc.title);
  $('#capTx').textContent=b.txt;
  $('#chName').textContent=sc.ch.title;
  CHS.forEach(c=>c.btn.classList.toggle('on',c===sc.ch));
  if(playing&&voice&&o.speak!==false)say(b.txt);
  ui();
}

/* voice */
let esVoice=null;const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();esVoice=vs.find(v=>/^es[-_](CL|419|MX|US|AR|CO)/i.test(v.lang))||vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}
if(hasTTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}else{bVoice.disabled=true;bVoice.title='Tu navegador no tiene síntesis de voz'}
function say(txt){
  if(!hasTTS){vDone=true;return}
  try{speechSynthesis.cancel()}catch(e){}
  vDone=false;const tok={};sayTok=tok;
  const parts=(txt.match(/[^.!?]+[.!?]*/g)||[txt]).map(p=>p.trim()).filter(Boolean);
  parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang=esVoice?esVoice.lang:'es-ES';if(esVoice)u.voice=esVoice;u.rate=Math.min(2,speed*1.05);
    if(k===parts.length-1)u.onend=()=>{if(sayTok===tok)vDone=true};u.onerror=()=>{if(sayTok===tok)vDone=true};
    try{speechSynthesis.speak(u)}catch(e){vDone=true}});
  clearTimeout(vTimer);vTimer=setTimeout(()=>{if(sayTok===tok)vDone=true},(BE[g].d/speed)*1600+3000);
}
function hush(){if(hasTTS){sayTok=null;try{speechSynthesis.cancel()}catch(e){}}vDone=true}

/* transport */
function play(){if(!started){started=true;big.hidden=true;$('#resume').hidden=true}
  if(g===BE.length-1&&t>=BE[g].d-.05)go(0,0,{speak:false});
  playing=true;if(voice)say(BE[g].txt);ui()}
function pause(){playing=false;hush();ui()}
function next(){go(g+1,0)}
function prev(){if(t>2.5)go(g,0);else go(g-1,0)}
function ui(){icPlay.setAttribute('d',playing?'M6 5h4v14H6zM14 5h4v14h-4z':'M7 4.5v15l12-7.5z');bPlay.setAttribute('aria-label',playing?'Pausar':'Reproducir')}
bPlay.onclick=()=>playing?pause():play();big.onclick=play;
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
bSpeed.onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];bSpeed.textContent=speed+'×';if(playing&&voice)say(BE[g].txt)};
bVoice.onclick=()=>{voice=!voice;bVoice.setAttribute('aria-pressed',voice);bVoice.textContent='Voz: '+(voice?'sí':'no');if(voice){pickVoice();if(playing)say(BE[g].txt)}else hush()};
bFs.onclick=()=>{if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen().catch(()=>{})}else if(player.requestFullscreen){player.requestFullscreen().catch(()=>{})}};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.code==='Space'||e.key==='k'){e.preventDefault();playing?pause():play()}
  else if(e.key==='ArrowRight'){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key==='f'||e.key==='F'){bFs.click()}});

/* seek bar */
function TatX(x){const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))*TOTAL}
function seekT(T){const i=idxAt(T);go(i,Math.min(T-BE[i].st,BE[i].d-.05),{speak:false})}
bar.addEventListener('pointerdown',e=>{dragging=true;try{bar.setPointerCapture(e.pointerId)}catch(_){};seekT(TatX(e.clientX))});
bar.addEventListener('pointermove',e=>{const T=TatX(e.clientX);if(dragging)seekT(T);let c=CHS[0];CHS.forEach(h=>{if(h.start<=T)c=h});tip.hidden=false;tip.textContent=fmt(T)+' · '+c.title;const r=bar.getBoundingClientRect();tip.style.left=Math.max(70,Math.min(r.width-70,e.clientX-r.left))+'px'});
bar.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(playing&&voice)say(BE[g].txt)}});
bar.addEventListener('pointerleave',()=>{tip.hidden=true});

/* resume */
let saved=0;try{saved=+localStorage.getItem(KEY)||0}catch(e){}
if(saved>20&&saved<TOTAL-10){$('#resume').hidden=false;$('#bRes').textContent='Continuar en '+fmt(saved);
  $('#bRes').onclick=()=>{seekT(saved);play()};$('#bRes0').onclick=()=>{seekT(0);play()}}

/* fit */
function fit(){const fs=document.fullscreenElement===player;
  if(fs){const W=window.innerWidth,H=window.innerHeight-ctl.offsetHeight-cap.offsetHeight;frame.style.width=Math.min(W,H*16/9)+'px'}else frame.style.width='';
  stage.style.transform=`scale(${frame.clientWidth/1280})`}
try{new ResizeObserver(fit).observe(frame)}catch(e){window.addEventListener('resize',fit)}
fit();

/* loop */
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&!dragging){const b=BE[g];t+=dt*speed;
    if(voice){if(vDone&&t>=1.2){if(g<BE.length-1)go(g+1,0);else pause()}else if(t>b.d)t=b.d-.001}
    else if(t>=b.d){if(g<BE.length-1)go(g+1,t-b.d);else{t=b.d;pause()}}
    if(now-lastSave>2500){lastSave=now;try{localStorage.setItem(KEY,String(BE[g].st+t))}catch(e){}}}
  const b=BE[g],sc=SC[b.s];
  if(sc.loop&&curRoot&&cur===sc){try{sc.loop(b.st-sc.start+t,curRoot,b.j,t)}catch(e){}}
  const T=b.st+Math.min(t,b.d),p=T/TOTAL*100;fill.style.width=p+'%';knob.style.left=p+'%';
  bar.setAttribute('aria-valuenow',Math.round(T));bar.setAttribute('aria-valuemax',Math.round(TOTAL));
  $('#time').textContent=fmt(T)+' / '+fmt(TOTAL);
  requestAnimationFrame(loop)}
go(0,0,{speak:false});requestAnimationFrame(loop);
})();
</script>
